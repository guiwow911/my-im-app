name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 设置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装项目依赖与 Capacitor CLI
        run: |
          mkdir -p www
          npm install
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android

      - name: 重建 Android 平台工程
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: 确保 Gradle 脚本具有执行权限
        run: |
          cd android
          chmod +x gradlew

      - name: 编译 APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 上传 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: IMApp-Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
