name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 创建基础网页占位文件
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>IMApp</title></head><body><h1>Loading...</h1></body></html>' > www/index.html

      - name: 安装依赖
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 初始化并同步 Android 平台
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: 编译 Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: IMApp-Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
